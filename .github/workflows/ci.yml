name: Admin CMS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  admin-checks:
    name: Next.js 16 Checks
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: "dummy_secret_for_ci_build_test_1234567890"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api/v1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install, Lint & Build Admin
        run: |
          npm ci
          npm run lint
          npm run build
